name: Uniqlo Sales Alerts

on:
  schedule:
    - cron: "0/20 * * * *"
  workflow_dispatch:

concurrency:
  group: uniqlo-sales-alerter
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  uniqlo-sales-alerts:
    runs-on: ubuntu-latest
    environment: main

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e .

      - name: Run Uniqlo sales alerts
        run: uniqlo-sales-alerts --once
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_TO: ${{ secrets.SMTP_TO }}

      - name: Save seen variants
        run: |
          if [ ! -f .seen_variants.json ]; then
            echo "No seen-variants state file to save."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .seen_variants.json
          git diff --cached --quiet && exit 0
          git commit -m "Update seen variants"
          git push origin HEAD:${{ github.ref_name }}
